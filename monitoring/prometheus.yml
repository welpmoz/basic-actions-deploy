global:
  scrape_interval: 15s

scrape_configs:
  - job_name: spring-quiz-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          env: local

  # Uncomment to also scrape the app deployed on Render:
  # - job_name: spring-quiz-render
  #   scheme: https
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["<your-service>.onrender.com"]
  #       labels:
  #         env: render
